name: Build example plugin

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build/install bindings
        run: pip install .
      - name: Build example plugin
        run: |
          cd example
          pumpkin-plugin-build main
