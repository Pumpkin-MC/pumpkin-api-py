[project]
name = "pumpkin-api-py"
version = "0.1.3"
description = "Pumpkin plugin API for Python"
authors = [{ name = "alex" }]
license = "MIT OR Apache-2.0"
dependencies = ["componentize-py==0.25.1"]
readme = "README.md"
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/Pumpkin-MC/pumpkin-api-py"
Repository = "https://github.com/Pumpkin-MC/pumpkin-api-py"

[project.scripts]
pumpkin-plugin-build = "pumpkin_api.build:main"

[build-system]
requires = ["hatchling", "componentize-py==0.25.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/pumpkin_api", "hatch_build.py", "wit/v0.1"]

[tool.hatch.build.targets.wheel]
include = ["src/pumpkin_api", "wit/v0.1/"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"wit/v0.1/" = "pumpkin_api/wit"

[tool.hatch.build.targets.wheel.hooks.custom]
